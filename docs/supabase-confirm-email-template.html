<!--
  Paste into Supabase Dashboard → Authentication → Email Templates → Confirm sign up.

  Why: the default {{ .ConfirmationURL }} hits supabase.co/auth/v1/verify then
  redirects to Site URL. If Site URL is still localhost (or a disallowed
  redirect_to), Safari and Gmail’s in-app browser show “can’t connect to server.”

  This template sends users straight to our domain with a token_hash. The
  /auth/confirm route calls verifyOtp and sets the session cookies.
-->
<h2>Confirm your email</h2>
<p>Thanks for joining RetainWrite. Confirm this email to finish creating your account.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app"
    >Confirm email address</a
  >
</p>
<p>If the button doesn’t work, copy and paste this URL into Safari or Chrome:</p>
<p>{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app</p>
